" fill="#e8b93c"/></svg><b>Улица</b><span>с тротуаром</span><i class="pr"></i></button></div></div><div id="bar"><button id="b-road" aria-label="Дороги"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 3h6l5 18H4z" fill="#aab6cc"/><path d="M12 5v3M12 10v3M12 15v4" stroke="#1B2A3D" stroke-width="1.7" stroke-linecap="round"/></svg></button><button id="b-erase" aria-label="Снос"><svg viewBox="0 0 32 24" width="36" height="27"><rect x="8" y="15" width="19" height="7" rx="3.5" fill="#2a2f3a"/><rect x="11" y="8" width="12" height="8" rx="1.5" fill="#f2b632"/><rect x="16" y="3" width="7" height="6" rx="1" fill="#f2b632"/><rect x="17.5" y="4.5" width="3.5" height="3" fill="#bfe0ff"/><rect x="6" y="11" width="6" height="2" fill="#d99a1b"/><path d="M2 6h4v12H2z" fill="#f2b632" stroke="#b9791a" stroke-width=".8"/></svg></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;let seed=7;
const rnd=()=>(seed=seed*16807%2147483647)/2147483647,RR=(a,b)=>a+rnd()*(b-a);
const ren=new T.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setClearColor(0xb9cdd6);const ce=console.error.bind(console);console.error=(...a)=>{ce(...a);const d=document.getElementById('err');d.style.display='block';d.textContent+=a.join(' ').slice(0,400)+'\n'};addEventListener('error',e=>console.error(e.message,e.lineno));
document.body.appendChild(ren.domElement);
const scene=new T.Scene();scene.fog=new T.Fog(0xb9cdd6,120,900);
const cam=new T.PerspectiveCamera(45,1,.5,2500);

// ---------- небо ----------
const sky=(()=>{const g=new T.SphereGeometry(1200,24,12),p=g.attributes.position,c=[],a=new T.Color(0x7aa3d0),b=new T.Color(0xb9cdd6),t=new T.Color();
for(let i=0;i<p.count;i++){t.copy(b).lerp(a,Math.pow(Math.max(0,p.getY(i)/1200),.6));c.push(t.r,t.g,t.b)}
g.setAttribute('color',new T.Float32BufferAttribute(c,3));
const m=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false}));scene.add(m);return m})();
scene.add(new T.HemisphereLight(0xf4f8ff,0x9db36a,.7));
const sun=new T.DirectionalLight(0xfff0d0,.5);sun.position.set(-40,90,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;sun.shadow.normalBias=.4;sun.shadow.camera.near=10;sun.shadow.camera.far=400;scene.add(sun,sun.target);

// ---------- утилиты ----------
const Q=new T.Quaternion(),E=new T.Euler(),V=new T.Vector3(),S3=new T.Vector3();
const mat=(x,y,z,sx,sy,sz,ry=0,rx=0,rz=0)=>new T.Matrix4().compose(V.set(x,y,z),Q.setFromEuler(E.set(rx,ry,rz)),S3.set(sx,sy,sz));
function build(ps,k){const P=[],C=[],N=[];
for(const o of ps){let sg=o.g;if((k>1||LOW)&&sg===ICO)sg=ICOL;const g=sg.index?sg.toNonIndexed():sg.clone();const a0=g.attributes.position,yr=o.yr||[-1,1],y0=[];for(let i=0;i<a0.count;i++)y0.push((a0.getY(i)-yr[0])/(yr[1]-yr[0]));
g.applyMatrix4(mat(...o.p,o.s[0]*k,o.s[1]*k,o.s[2]*k,o.ry||0,o.rx||0,o.rz||0));
const a=g.attributes.position,nn=g.attributes.normal,lo=o.ao||1,c=new T.Color(o.col);
for(let i=0;i<a.count;i++){const f=o.ao?lo+(1.08-lo)*y0[i]:1;P.push(a.getX(i),a.getY(i),a.getZ(i));N.push(nn.getX(i),nn.getY(i),nn.getZ(i));C.push(c.r*f,c.g*f,c.b*f)}}
const G=new T.BufferGeometry();G.setAttribute('position',new T.Float32BufferAttribute(P,3));
G.setAttribute('color',new T.Float32BufferAttribute(C,3));G.setAttribute('normal',new T.Float32BufferAttribute(N,3));return G}
const kit=ps=>[build(ps,1),build(ps,1.07)];
const NAT=[],ZERO=new T.Matrix4().makeScale(0,0,0);
const OUT=new T.MeshBasicMaterial({color:0x1c2813,side:T.BackSide}),LM=new T.MeshLambertMaterial({vertexColors:true});
function inst(G,O,arr,M,sh){if(!arr.length)return;const m=new T.InstancedMesh(G,M||LM,arr.length),tn=new T.Color();m.castShadow=m.receiveShadow=!!sh;
arr.forEach((x,i)=>{m.setMatrixAt(i,x);if(!M){const v=RR(.88,1.1);m.setColorAt(i,tn.setRGB(v*RR(.96,1.04),v,v*RR(.9,1.04)))}});m.frustumCulled=false;WG.add(m);NAT.push([m,arr]);
if(O){const o=new T.InstancedMesh(O,OUT,arr.length);o.instanceMatrix=m.instanceMatrix;o.frustumCulled=false;WG.add(o)}}

// ---------- трава ----------
function grassTex(){const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');g.scale(2,2);
g.fillStyle='#8aa857';g.fillRect(0,0,512,512);
const cols=['#96b360','#7f9d4e','#93ae5c','#86a354','#a0b96a'];
for(let i=0;i<260;i++){const x=rnd()*512,y=rnd()*512,r=RR(20,70);g.fillStyle=cols[i%5];g.globalAlpha=.16;
for(const dx of[-512,0,512])for(const dy of[-512,0,512]){g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fill()}}
g.globalAlpha=.55;g.lineWidth=.7;
for(let i=0;i<7000;i++){const x=rnd()*512,y=rnd()*512;g.strokeStyle=rnd()<.5?'#7c9a4b':'#a0bb69';g.beginPath();g.moveTo(x,y);g.lineTo(x+RR(-3,3),y+RR(2,6));g.stroke()}
g.lineWidth=.8;g.globalAlpha=.7;for(let i=0;i<500;i++){const x=rnd()*500+6,y=rnd()*500+8;g.strokeStyle=rnd()<.5?'#6f8f42':'#b2c978';g.beginPath();g.moveTo(x-2,y-4);g.lineTo(x,y);g.lineTo(x+2,y-5);g.stroke()}
const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=ren.capabilities.getMaxAnisotropy();return t}
// ---------- мир: общие данные (наполняет genWorld) ----------
let WG=null,RP=[],CH=[],RB={},HP=[0,0,0],RW=1,RT=20,LOW=0,WP=[],RN='',FN='';
const GT=grassTex();GT.repeat.set(150,150);
// расстояние до реки в «ширинах» русла (не больше 99). Точки лежат в ячейках 128×128 с числовым ключом; p.q = 1/ширина² считается заранее — так в разы быстрее
const rbk=(p)=>((p.x>>7)+16)*64+(p.z>>7)+16;
const dRiver=(x,z)=>{let m=9801;const a=x>>7,b=z>>7;for(let i=a-1;i<=a+1;i++)for(let j=b-1;j<=b+1;j++){const l=RB[(i+16)*64+j+16];if(l)for(let k=0;k<l.length;k++){const p=l[k],dx=x-p.x,dz=z-p.z,d=(dx*dx+dz*dz)*p.q;if(d<m)m=d}}return Math.sqrt(m)};
// внутри барьера земля плоская; за барьером поднимаются холмы, вдоль реки — долина
const hill=(x,z)=>{const k=Math.min(1,Math.max(0,(Math.max(Math.abs(x),Math.abs(z))-H*CS-24)/220));if(k<=0)return 0;
const c=Math.min(1,Math.max(0,(Math.min(dRiver(x,z),50)-26)/24));
return c*c*(3-2*c)*k*k*(3-2*k)*(30+16*Math.sin(x*.017+HP[0])*Math.cos(z*.021+HP[1])+10*Math.sin(x*.05+z*.04+HP[2]))};
function ribbon(ch,w,y,M,uv,sa){const pos=[],uvs=[],idx=[];
ch.forEach((p,i)=>{const a=ch[Math.max(0,i-1)],b=ch[Math.min(ch.length-1,i+1)];let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
const ww=w*p.w,wl=ww*(1+sa*Math.sin(p.i*.017+1)),wr=ww*(1+sa*Math.sin(p.i*.013+4));
pos.push(p.x-tz*wl,y,p.z+tx*wl,p.x+tz*wr,y,p.z-tx*wr);uvs.push(0,p.i*uv,1,p.i*uv);
if(i<ch.length-1){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}});
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
g.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));g.setIndex(idx);g.computeVertexNormals();
WG.add(new T.Mesh(g,M))}
const wtex=(()=>{const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');
const gr=g.createLinearGradient(0,0,128,0);[[0,'#7db0cc'],[.18,'#4f86ad'],[.5,'#4a7ea8'],[.82,'#4f86ad'],[1,'#7db0cc']].forEach(s=>gr.addColorStop(...s));
g.fillStyle=gr;g.fillRect(0,0,128,256);g.strokeStyle='#cfe6f2';g.lineWidth=3;g.lineCap='round';
for(let i=0;i<9;i++){const x=RR(20,108),y=RR(0,256),l=RR(8,18);for(const o of[0,-256]){g.beginPath();g.moveTo(x,y+o);g.lineTo(x+3,y+o+l);g.stroke()}}

// ---------- модели ----------
const ICO=new T.IcosahedronGeometry(1,2),ICOL=new T.IcosahedronGeometry(1,1),ICO0=new T.IcosahedronGeometry(1,0),CYL=new T.CylinderGeometry(.6,1,1,10),CONE=new T.ConeGeometry(1,1,12);
const PAL=['#33501f','#3f5d24','#4d6c2a','#5d7d33'],BR='#5b3622';
function broadleaf(pal=PAL){const ps=[{g:CYL,col:BR,p:[0,2,0],s:[.62,4.4,.62],ao:.6,yr:[-.5,.5]}];
for(let b=0;b<3;b++){const s=b%2?1:-1,l=RR(2.2,3);ps.push({g:CYL,col:BR,p:[s*.9,4.3+b*.3,(b-1)*.5],s:[.3,l,.3],rz:-s*RR(.4,.7),rx:(b-1)*.35})}
const n=6+(rnd()*3|0);
for(let i=0;i<n;i++){const a=rnd()*6.28,r=RR(0,2.1),y=RR(5,8),k=RR(1.5,2.4),ci=Math.max(0,Math.min(3,Math.floor((y-5)/3*4+RR(-1,1))));
ps.push({g:ICO,col:pal[ci],p:[Math.cos(a)*r,y,Math.sin(a)*r],s:[k,k*.85,k],ry:rnd()*6,ao:.72})}return ps}
function pine(){const ps=[{g:CYL,col:'#4f3220',p:[0,.8,0],s:[.45,1.8,.45]}],cs=['#2c4527','#335029','#3b5a2d'];

// ========== ГЕНЕРАТОРЫ МИРА: реки и леса ==========
// У каждого свой генератор случайных чисел (от номера мира): выбор леса не меняет реку и наоборот.
const mixS=(a,b)=>{let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x7f4a7c15,0xc2b2ae35);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;return(h>>>0)%2147483646+1};
const mkRng=(sd,salt)=>{let s=mixS(sd|0,salt);const f=()=>(s=s*16807%2147483647)/2147483647;for(let i=0;i<8;i++)f();return f};

// ---------- РЕКИ ----------
// Русло — «шагающая» линия: идёт к цели с ограниченным радиусом поворота, извилины — плавные качания курса.
// Развилки, рукава, острова, притоки — операции над готовой рекой. Точка русла: {x,z,w,i}: w — ширина, i — индекс течения.
function genRivers(sd,o,E){
const f=mkRng(sd,101),rr=(a,b)=>a+f()*(b-a),Z=E+650,ST=3,TAU=6.2832,
P=(s,t)=>[[Z,t],[-Z,t],[t,Z],[t,-Z]][s],
inA=(p,m)=>Math.abs(p.x)<E-m&&Math.abs(p.z)<E-m,
wr=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a},
cl=(v,a,b)=>v<a?a:v>b?b:v,sm=u=>{u=cl(u,0,1);return u*u*(3-2*u)},sgn=()=>f()<.5?1:-1;
// класс реки: 1 узкая, 2 широкая, 3 двойная (семейство развилок), 4 обычная
let cls=o.w;if(!cls){const r=f();cls=r<.3?4:r<.45?1:r<.6?2:3}
const W0=[0,rr(.58,.78),rr(1.3,1.5),rr(1.0,1.3),rr(.85,1.2)][cls],
amp=o.r==1?rr(25,70):o.r==2?rr(150,260):rr(30,230),
KS=[['y',24],['t',12],['asym',14],['delta',12],['casc',8],['isl',12],['chain',6],['x',12]],
pickKind=()=>{let t=KS.reduce((a,k)=>a+k[1],0)*f();for(const k of KS)if((t-=k[1])<0)return k[0];return'y'},
kind0=cls==3?pickKind():'single';
let net,grow=0;
const mkch=(p,x)=>{const c=Object.assign({p},x);net.ch.push(c);return c};
// параметры извилин: три волны курса — большая, средняя, мелкая
const meander=sc=>{const a=amp*sc,l0=Math.max(rr(750,1400),a*4.83),l1=rr(300,560),l2=rr(120,230);
return{A:[Math.min(1.3,a*TAU/l0),Math.min(.35,a*.25*TAU/l1),rr(.035,.1)*(.5+.5*cl(a/150,0,1))],k:[TAU/l0,TAU/l1,TAU/l2],ph:[rr(0,TAU),rr(0,TAU),rr(0,TAU)]}};
// шаг за шагом: курс подруливает к ближайшей цели (последняя цель «липкая»), поверх — качание курса
const walk=(x,z,h,wps,M,rmin,ramp)=>{const pts=[{x,z}],TR=ST/rmin,last=wps.length-1;let wi=0;
for(let n=0,s=0;n<1600;n++){
while(wi<last){const w=wps[wi],dx=w[0]-x,dz=w[1]-z,d=Math.hypot(dx,dz);if(d<70||(d<rmin*2.5&&dx*Math.cos(h)+dz*Math.sin(h)<0))wi++;else break}
const w=wps[wi];h+=cl(wr(Math.atan2(w[1]-z,w[0]-x)-h),-TR,TR);
s+=ST;const e=Math.min(1,s/ramp),hn=e*(M.A[0]*Math.cos(s*M.k[0]+M.ph[0])+M.A[1]*Math.cos(s*M.k[1]+M.ph[1])+M.A[2]*Math.cos(s*M.k[2]+M.ph[2]));
x+=Math.cos(h+hn)*ST;z+=Math.sin(h+hn)*ST;pts.push({x,z});
if(Math.abs(x)>=Z||Math.abs(z)>=Z)break}
return pts};
// главное русло: через весь мир (насквозь) или с поворотом (угол)
const trunk=()=>{const s0=f()*4|0,A=P(s0,rr(-.7,.7)*E);let wps;
if(f()<.66)wps=[P(s0^1,rr(-.7,.7)*E)];
else{const s1=((s0>>1)^1)*2+(f()*2|0);wps=[[rr(-.4,.4)*E,rr(-.4,.4)*E],P(s1,rr(-.7,.7)*E)]}
return walk(A[0],A[1],Math.atan2(wps[0][1]-A[1],wps[0][0]-A[0]),wps,meander(1),rr(140,230),200)};
// ширина вдоль русла: плавно меняется; у ветки сначала равна ширине родителя и плавно переходит к своей
const setW=(c,wS,wT,lt,sg,md,lo)=>{const n=c.p.length,wa=rr(0,TAU),wb=rr(0,TAU);
c.p.forEach((p,k)=>{const m=1+md*(.22*Math.sin(p.i*.011+wa)+.14*Math.sin(p.i*.027+wb));let w;
if(wS==null)w=wT*m*(1+grow*(k/Math.max(1,n-1)-.5));
else{const d=sg>0?k*ST:(n-1-k)*ST,e=sm(d/lt);w=wS*(1-e)+wT*m*e}
p.w=cl(w,lo,1.7)})};
const rew=(c,k,ratio)=>setW({p:c.p.slice(k)},c.p[k].w,c.p[k].w*ratio,rr(120,220),1,1,.55);
const widen=(c,k1,k2,fac)=>c.p.forEach((p,i)=>{p.w=cl(p.w*(1+(fac-1)*sm((i-k1+12)/24)*(1-sm((i-k2+12)/24))),.55,1.7)});
const range=(c,m)=>{let a=-1,b=-1;c.p.forEach((p,i)=>{if(inA(p,m)){if(a<0)a=i;b=i}});return[a,b]};
const pickK=(c,lo,hi,m=100)=>{const[a,b]=range(c,m);return a<0||b-a<90?-1:Math.round(a+(b-a)*rr(lo,hi))};
// ветка от точки k русла c: sg=+1 — уходит вниз по течению (рукав), sg=-1 — впадает (приток); ang — угол от русла
const fork=(c,k,sg,ang,ratio,x)=>{x=x||{};const J=c.p[k],q=c.p[cl(k-sg*5,0,c.p.length-1)],h0=Math.atan2(J.z-q.z,J.x-q.x),hb=h0+ang,
far=[J.x+Math.cos(hb)*5000,J.z+Math.sin(hb)*5000],pts=walk(J.x,J.z,h0,[far],meander(x.sc||.8),x.rmin||rr(120,200),x.ramp||150);

const ch=mkch(pts,{kid:1});setW(ch,J.w,ratio*J.w,x.lt||rr(110,200),sg,.8,.42);net.jz.push([J.x,J.z]);return ch};
// остров: русло расходится на два рукава и сходится снова; возвращает продолжение русла
const island=(c,a,n,Mo,as,cw)=>{const b=a+n,arm=[[],[]];
for(let i=a;i<=b;i++){const p=c.p[i],q=c.p[Math.min(c.p.length-1,i+1)],r=c.p[Math.max(0,i-1)],l=Math.hypot(q.x-r.x,q.z-r.z)||1,nx=-(q.z-r.z)/l,nz=(q.x-r.x)/l,
s=Math.sin(Math.PI*(i-a)/n),fa=Math.pow(Math.max(0,s),1.3),sw=Math.pow(Math.max(0,s),.7);
[1,-1].forEach((sg,k)=>{const off=Mo*fa*(1+(k?as:-as))*sg;arm[k].push({x:p.x+nx*off,z:p.z+nz*off,w:Math.max(.42,p.w*(1-cw[k]*sw)),i:p.i})})}
const post=mkch(c.p.slice(b));c.p.length=a+1;mkch(arm[0],{arm:1});mkch(arm[1],{arm:1});
net.jz.push([c.p[a].x,c.p[a].z],[post.p[0].x,post.p[0].z]);return post};

const tryBuild=kind=>{
net={ch:[],jz:[],name:'Река',cn:0};
const T0=mkch(trunk().map((q,i)=>({x:q.x,z:q.z,i})),{main:1});
grow=kind=='single'&&f()<.45?rr(-.4,.4):0;
setW(T0,null,W0,0,1,1,.55);
if(cls==1)net.name='Узкая река';else if(cls==2)net.name='Широкая река';
switch(kind){
case'y':case't':{// Y-развилка: русло делится на два
const k=pickK(T0,.28,.72);if(k<0)return 0;const big=kind=='t',s=sgn(),m=big?[.95,1.4]:[.22,.62],
a1=s*rr(m[0],m[1]),a2=(!big&&f()<.15?s:-s)*rr(m[0],m[1]);if(Math.abs(a1-a2)<.42)return 0;
T0.p.length=k+1;fork(T0,k,1,a1,rr(.62,.9));fork(T0,k,1,a2,rr(.5,.85));net.name=big?'Развилка «Т»':'Развилка Y';break}
case'asym':{// рукав или приток отходит от основной реки
const k=pickK(T0,.3,.7);if(k<0)return 0;const sg=f()<.5?1:-1;
fork(T0,k,sg,sgn()*rr(.45,1.1),rr(.45,.75));rew(T0,k,sg>0?rr(.72,.92):rr(1.1,1.3));net.name=sg>0?'Боковой рукав':'Приток';break}
case'delta':{// дельта: от русла отходят два рукава подряд — веер из трёх
const k=pickK(T0,.22,.45);if(k<0)return 0;const k2=k+Math.round(rr(25,70));if(k2>=T0.p.length-40||!inA(T0.p[k2],90))return 0;const s=sgn();
fork(T0,k,1,s*rr(.4,.7),rr(.55,.75));rew(T0,k,rr(.8,.95));
fork(T0,k2,1,-s*rr(.35,.7),rr(.55,.8));rew(T0,k2,rr(.75,.92));net.name='Дельта';break}
case'casc':{// каскад: развилка, а у рукавов — ещё развилки
const k=pickK(T0,.18,.42);if(k<0)return 0;const s=sgn(),a1=s*rr(.3,.6),a2=-s*rr(.3,.6);
T0.p.length=k+1;const kids=[[fork(T0,k,1,a1,rr(.7,.88)),a1],[fork(T0,k,1,a2,rr(.7,.88)),a2]];let n=0;
for(const[c,a]of kids)if(f()<.85){const kk=Math.round(rr(70,150));if(kk<c.p.length-40&&inA(c.p[kk],80)){
fork(c,kk,1,(f()<.6?Math.sign(a):-Math.sign(a))*rr(.3,.65),rr(.55,.8));rew(c,kk,rr(.7,.9));n++}}
if(!n)return 0;net.name='Каскад развилок';break}
case'isl':case'chain':{// остров или цепочка островов
const nI=kind=='chain'?2+(f()<.5?1:0):1;let c=T0;
for(let q=0;q<nI;q++){const[a0,b0]=range(c,80),n=Math.round(rr(70,150)),lo=a0+(q?25:15),hi=b0-n-12;if(a0<0||hi<lo){if(q)break;return 0}
c=island(c,lo+Math.round(f()*(hi-lo)),n,rr(38,80)*Math.max(.9,W0),rr(0,.25),[rr(.25,.5),rr(.25,.5)])}
net.name=kind=='chain'?'Цепь островов':'Остров';break}
case'x':{// два русла сливаются в одно и снова расходятся
const k1=pickK(T0,.22,.4);if(k1<0)return 0;const k2=k1+Math.round(rr(60,130));if(k2>=T0.p.length-40||!inA(T0.p[k2],90))return 0;const s=sgn();
widen(T0,k1,k2,rr(1.15,1.35));fork(T0,k1,-1,s*rr(.5,1),rr(.65,.95));fork(T0,k2,1,-s*rr(.5,1),rr(.65,.95));rew(T0,k2,rr(.7,.9));net.name='Слияние и разделение';break}
}
// ручьи-притоки
const nc=kind=='single'?(f()<.28?(f()<.35?2:1):0):(f()<.15?1:0);
for(let q=0;q<nc;q++){const cs=net.ch.filter(c=>!c.arm&&c.p.length>150&&c.p.filter(p=>inA(p,60)).length>80);if(!cs.length)break;
const c=cs[f()*cs.length|0],k=pickK(c,.12,.88,110);if(k<0)continue;const J=c.p[k];
if(net.jz.some(z=>Math.hypot(z[0]-J.x,z[1]-J.z)<220))continue;
const ck=fork(c,k,f()<.7?-1:1,sgn()*rr(.5,1.15),rr(.32,.5),{sc:.7});
if(ck.p.filter(p=>inA(p,24)).length<30){net.ch.pop();net.jz.pop();continue}net.cn++}
return valid(kind)};

// проверка: достаточно реки в игровой зоне, нет острых изгибов и слипшихся русел
const valid=kind=>{let tot=0;
for(const c of net.ch){c.na=c.p.filter(p=>inA(p,24)).length;tot+=c.na;if(c.kid&&c.na<30)return 0}
if(tot<(kind=='single'?130:210))return 0;
for(const c of net.ch){const p=c.p;for(let i=3;i<p.length-3;i+=1){
const a0=Math.atan2(p[i].z-p[i-3].z,p[i].x-p[i-3].x),a1=Math.atan2(p[i+3].z-p[i].z,p[i+3].x-p[i].x);if(Math.abs(wr(a1-a0))>.26)return 0}}
const pts=[];net.ch.forEach((c,ci)=>c.p.forEach((p,i)=>{if(i%2==0)pts.push([p.x,p.z,ci,i])}));
const G={},cs=48;
for(const a of pts){const kx=Math.floor(a[0]/cs),kz=Math.floor(a[1]/cs);
for(let i=kx-1;i<=kx+1;i++)for(let j=kz-1;j<=kz+1;j++){const l=G[i+','+j];if(l)for(const b of l){
if(Math.hypot(a[0]-b[0],a[1]-b[1])>=46)continue;
if(a[2]==b[2]&&Math.abs(a[3]-b[3])<80)continue;
if(net.jz.some(z=>Math.hypot(z[0]-a[0],z[1]-a[1])<260&&Math.hypot(z[0]-b[0],z[1]-b[1])<260))continue;
return 0}}
const k=kx+','+kz;(G[k]||(G[k]=[])).push(a)}
return 1};
const fin=()=>{const CH=net.ch.map(c=>c.p).filter(p=>p.length>1);
return{CH,RP:[].concat(...CH),name:net.name+(net.cn?(net.cn>1?' + ручьи':' + ручей'):''),flow:f()<.5?1:-1}};
for(let att=0;att<120;att++){
const kind=att<55?kind0:att<90?(cls==3?'y':'single'):'single';
if(tryBuild(kind)){const r=fin();r.att=att;return r}}
// запасной вариант: плавная река через весь мир
net={ch:[],jz:[],name:'Река',cn:0};const pts=[];for(let x=-Z;x<=Z;x+=ST)pts.push({x,z:Math.sin(x*.004)*60,i:pts.length});
setW(mkch(pts),null,.9,0,1,1,.55);const r=fin();r.att=999;return r}

// ---------- ЛЕСА ----------
// Поле «лесистости» собирается из случайного набора слоёв: шум с искажением, рощи, полосы, кольцо по краю, центр, берега рек, поляны.
// Все слои переводятся в «ранги» — лес занимает ровно заданную долю карты, а его форма каждый раз своя.
function genForest(sd,o,E,RP){
const f=mkRng(sd,202),rr=(a,b)=>a+f()*(b-a),TAU=6.2832,
D=o.f?o.f-1:(f()<.3?0:f()<.6?1:2),
M=[{cv:[.04,.085],nt:260,dm:12,ln:[50,90]},{cv:[.1,.17],nt:620,dm:11,ln:[30,60]},{cv:[.2,.3],nt:1100,dm:9.5,ln:[8,20]}][D],
LAT=new Float32Array(4096);for(let i=0;i<4096;i++)LAT[i]=f();
const vn=(x,z)=>{const xi=Math.floor(x),zi=Math.floor(z),a=x-xi,b=z-zi,u=a*a*(3-2*a),v=b*b*(3-2*b),g=(i,j)=>LAT[((i&63)<<6)|(j&63)];
return(g(xi,zi)*(1-u)+g(xi+1,zi)*u)*(1-v)+(g(xi,zi+1)*(1-u)+g(xi+1,zi+1)*u)*v};
const fbm=(lam,oct)=>{const R=[];for(let i=0;i<oct;i++){const a=rr(0,TAU);R.push([Math.cos(a),Math.sin(a),rr(0,60),rr(0,60)])}
return(x,z)=>{let s=0,t=0,a=1,k=1/lam;for(let i=0;i<oct;i++){const r=R[i];s+=a*vn((x*r[0]-z*r[1])*k+r[2],(x*r[1]+z*r[0])*k+r[3]);t+=a;a*=.5;k*=2.03}return s/t}};
const N=96,X0=-1400,CZ=2800/(N-1),nd=i=>X0+i*CZ,ins=(i,j)=>Math.abs(nd(i))<E&&Math.abs(nd(j))<E;
